<!DOCTYPE html>
<html>
    <head>
        <title>Grid Practice</title>

        <link rel ="stylesheet" href = "grid.css">
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
            margin-top: 20px;
            display: grid;
            grid-template-columns: 100px 100px;
        ">
            <div class="div-1">
                div 1
            </div>
            <div class="div-2">
                div 2
                <p>text</p>
            </div>
        </div>
        
        <div style="
            margin-top: 20px;
            display: grid;
            grid-template-columns: 100px 100px 200px;
        ">
            <div class="div-1">
                100px
            </div>
            <div class="div-2">
                100px
                <p>text</p>
            </div>
            <div class="div-1">
                200px
            </div>
        </div>

        <div style="
            margin-top: 20px;
            display: grid;
            grid-template-columns: 100px 1fr;
        ">
            <div class="div-1">
                100px
            </div>
            <div class="div-2">
                1fr
            </div>
        </div>

        <div style="
            margin-top: 20px;
            display: grid;
            grid-template-columns: 100px 1fr 2fr;
        ">
            <div class="div-1">
                100px
            </div>
            <div class="div-2">
                1fr
            </div>
            <div class="div-1">
                2fr
            </div>
        </div>

        <div style="
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 20px;
            row-gap: 40px;
        ">
            <div style = "
                background-color: lightblue;
                height: 200px;
            ">
                1fr
            </div>
            <div style = "
                background-color: lightpink;
                height: 200px;
            ">
                1fr
            </div>
            <div style = "
                background-color: lightblue;
                height: 200px;
            ">
                1fr
            </div>

            <div style = "
                background-color: lightpink;
                height: 200px;
            ">
                1fr
            </div>
            <div style = "
                background-color: lightblue;
                height: 200px;
            ">
                1fr
            </div>
            <div style = "
                background-color: lightpink;
                height: 200px;
            ">
                1fr
            </div>
        </div>
    </body>
</html>
